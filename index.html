<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruslan Market | Karta bilan To'lov</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main: #7f46f0; --orange: #ff9800; --green: #28a745; --blue: #007bff; --red: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; padding-bottom: 80px; }
        #auth-page { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 320px; text-align: center; }
        .inp { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-reg { width: 100%; padding: 15px; background: var(--main); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; }
        .card img { width: 100%; height: 140px; object-fit: cover; background: #eee; }
        .p-info { padding: 10px; }
        .price { color: var(--main); font-weight: bold; font-size: 14px; }
        .title { font-size: 13px; font-weight: 500; height: 35px; overflow: hidden; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { border: none; background: none; font-size: 11px; color: #666; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .active { color: var(--main); font-weight: bold; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: flex-end; }
        .modal-content { background: #fff; width: 100%; padding: 25px; border-radius: 20px 20px 0 0; text-align: center; box-sizing: border-box; }
        .card-box { background: #f3f0ff; border: 1px dashed var(--main); padding: 10px; border-radius: 12px; margin: 10px 0; }
        .status-box { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--orange); text-align: left; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="auth-page" style="display: none;">
    <div class="auth-card">
        <h2 style="color: var(--main);">Xush kelibsiz!</h2>
        <input type="text" id="reg-name" class="inp" placeholder="Ismingiz">
        <input type="tel" id="reg-phone" class="inp" placeholder="Telefon raqamingiz">
        <button class="btn-reg" onclick="saveUser()">Do'konga kirish</button>
    </div>
</div>

<header><b>RUSLAN MARKET</b></header>

<div id="shop-page"><div class="container" id="product-list"></div></div>
<div id="orders-page" style="display:none; padding: 20px;">
    <h3>📦 Buyurtmalarim</h3>
    <div id="order-status-list"></div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="showPage('shop', this)"><span>🛍</span>Do'kon</button>
    <button class="nav-item" onclick="showPage('orders', this)"><span>📦</span>Buyurtmalar</button>
</div>

<div id="order-modal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <h3 id="m-title"></h3>
        <p id="m-price" style="font-size: 20px; color: var(--main); font-weight: bold;"></p>
        <div class="card-box">
            <small>To'lov uchun karta (Humo):</small><br>
            <b id="card-num">4073420067355457</b>
            <button onclick="copyCard()" style="font-size:10px; margin-left:5px; cursor:pointer;">Nusxa</button>
        </div>
        <select id="p-size" class="inp"></select>
        <input type="text" id="promo-code" class="inp" placeholder="Promokod (RUSLAN...)" oninput="checkPromo()">
        <button onclick="sendOrder()" style="background:#28a745; color:white;" class="btn-reg">To'lovni tasdiqlash</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function up25(p) { return Math.round(p * 1.25).toLocaleString(); }

    const products = [
        {name: "Qishki Kurtka Premium", price: 200000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=70951574663cbae2ac73b1f8a4f8a2ea3c06527a-9099023-images-thumbs&n=13"},
        {name: "Nike Air Max 270", price: 280000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=f1e7218c18bd5095bc3e5696f25fb4348235580a-4322265-images-thumbs&n=13"},
        {name: "Polo Dvoyka", price: 150000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=b8b693d50f4c2381d985a1c8f33d3cb0be4ca464-4027983-images-thumbs&n=13"},
        {name: "Klassik Shim", price: 99000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=410b6c32f91f6361a156b6f65a31f0c6d4faaf6f-5235890-images-thumbs&n=13"},
        {name: "Tufli Charm", price: 100000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=a0fe76efd8801116ec5dfd344f6f904cf2b54d3d-5236416-images-thumbs&n=13"},
        {name: "Hudi Oversize", price: 130000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=0820d25df2e30ed233e70414ddf08a298e916183-5307529-images-thumbs&n=13"},
        {name: "Adidas Yeezy", price: 200000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=30787d09a791c5c4c45821dd2120c2d8463c1ce0-5235999-images-thumbs&n=13"},
        {name: "suvarka aparat", price: 55000, type: "other", img: "https://avatars.mds.yandex.net/i?id=db3e3ea838e7139ba301d62bf81326cc1c84cb13-5279204-images-thumbs&n=13"},
        {name: "Charm Remen", price: 70000, type: "other", img: "https://avatars.mds.yandex.net/i?id=cc3213e0ac2fa192d5d29ae8c4eaa636f2ab6545-5388624-images-thumbs&n=13"},
        {name: "Rolex Watch", price: 350000, type: "other", img: "https://cdn1.ozone.ru/s3/multimedia-1-f/c600/7106545059.jpg"},
        {name: "Dior Bag", price: 190000, type: "other", img: "https://avatars.mds.yandex.net/i?id=f79142412e9a9b7e9e096648252a9c5cb545eb72-9226797-images-thumbs&n=13"},
        {name: "Zara Mokasina", price: 185000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=22d8abd1e0159833b74664f1e37e32232391a5fa-9152303-images-thumbs&n=13"},
        {name: "Sportivka Nike", price: 210000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=4e2ad4cb6f8bb2148e1372db2b732f36aad9cf56-5334272-images-thumbs&n=13"},
        {name: "Sviter Kashmir", price: 120000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=d09084e02bca0238a10123c4b8b63907c48a67fe-5876970-images-thumbs&n=13"},
        {name: "etik detiskiy", price: 65000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=2de6a0abd6d4c21e0652d8d6ab8aa9b9ac5c3a3e-5088700-images-thumbs&n=13"},
        {name: "Termos 1L", price: 35000, type: "other", img: "https://avatars.mds.yandex.net/i?id=cb19d8d4f51449e1d7b2f223701c0cceac170f06-5354769-images-thumbs&n=13"},
        {name: "etik qizbolalarga", price: 45000, type: "other", img: "https://avatars.mds.yandex.net/i?id=09c35d96d8de2db1debbc11dd510bd89d1ac157c-5165563-images-thumbs&n=13"},
        {name: "Slipper", price: 40000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=f7eca6059ad7eeb0fd7275ecb4ead8e1b1d3a394-16477287-images-thumbs&n=13"},
        {name: "Paypoq (12 juft)", price: 45000, type: "other", img: "https://avatars.mds.yandex.net/i?id=e62cd2900f57009005890eca9965dd170b756b56-5233320-images-thumbs&n=13"},
        {name: "Gucci Glasses", price: 125000, type: "other", img: "https://avatars.mds.yandex.net/i?id=79320094fd45192d98c11a4c562cf841230b4303-13095363-images-thumbs&n=13"},
        {name: "Mayka Oq", price: 30000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=dea2ae40a8886506b1f6bcd5df7d8a09a16a4c8d-5083805-images-thumbs&n=13"},
        {name: "Palto Klassik", price: 280000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=4b7e2423be88c3c91c2288bda8b7f530bed31428-11543356-images-thumbs&n=13"},
        {name: "Grey Svitshot", price: 110000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=a52fa236d5e23058498f47845134381620076a0c-4817585-images-thumbs&n=13"},
        {name: "Butsi CR7", price: 250000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=955f5a96ef0407a40036c57870d8a26858dc1de1-9147490-images-thumbs&n=13"},
        {name: "Charm Kasholok", price: 60000, type: "other", img: "https://avatars.mds.yandex.net/i?id=c946c87f9186063f371d28edfd551675f5b367ee-12321292-images-thumbs&n=13"},
        {name: "Jinsi Kurtka", price: 180000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=2806b3df83565217f518bc6d28669dd0b469da71-12346171-images-thumbs&n=13"},
        {name: "Ayollar Tufli", price: 195000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=e2848e85ba6b48b1ae981456bd1625821b9bd0d8-9266608-images-thumbs&n=13"},
        {name: "Shapka Sharf", price: 55000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=da6492ab1e012dfdb6f14d21e1e773014990bfc2-12323207-images-thumbs&n=13"},
        {name: "Powerbank Mi", price: 120000, type: "other", img: "https://avatars.mds.yandex.net/i?id=d14c1345a79ae8b7cf5e0079f58dad7a46615c5d-4080206-images-thumbs&n=13"},
        {name: "Real Madrid forma", price: 95000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=91dd766c7da0e17bca09609db0d0ff523bb867ee-5646461-images-thumbs&n=13"},
        {name: "velosiped", price: 600000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=ee2185a8c49748952fb1e3e616c44a156778aab5-5668729-images-thumbs&n=13"},
        {name: "Kargo Shim", price: 155000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=527c6bf4959b7393e145d6331eb86d1997330a50-12190079-images-thumbs&n=13"},
        {name: "Zontik", price: 50000, type: "other", img: "https://avatars.mds.yandex.net/i?id=f95de4ef87a20fd80cb0e69b943300478b24de5d-8236365-images-thumbs&n=13"},
        {name: "Soch Fen", price: 100000, type: "other", img: "https://avatars.mds.yandex.net/i?id=cfb4f0cc27e67359417b63ee89935b1df007ce1e-5166135-images-thumbs&n=13"},
        {name: "printercha", price: 95000, type: "other", img: "https://avatars.mds.yandex.net/i?id=4cbef11efd3ef5b256645f41bc7445940bd2f73f-10108411-images-thumbs&n=13"},
        {name: "Fila Sneakers", price: 220000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=8234a6722a98b9f5722c181de9122965a81b52c0-5470361-images-thumbs&n=13"},
        {name: "quloqchin", price: 30000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=07095e2b6bb3c1258f1bbe260580632124a5c502-5115418-images-thumbs&n=13"},
        {name: "Sandali", price: 80000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=e93e7e435d7594b6d12a37d39f75fdba38b22977-5642274-images-thumbs&n=13"},
        {name: "mafiya o'yini", price: 35000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=edef3ffbc286e535ca0aff0694bdf475dc2021a0-5354907-images-thumbs&n=13"},
        {name: "Charm Qo'lqop", price: 55000, type: "other", img: "https://avatars.mds.yandex.net/i?id=c327df75519325dabc72349597d1129978a636c8-4577841-images-thumbs&n=13"}
    ];

    window.onload = () => { if (!localStorage.getItem('ruslan_user')) document.getElementById('auth-page').style.display = 'flex'; renderProducts(); }
    function saveUser() {
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;
        if (name.length > 2 && phone.length > 6) { localStorage.setItem('ruslan_user', JSON.stringify({name, phone})); document.getElementById('auth-page').style.display = 'none'; }
    }
    function renderProducts() { document.getElementById('product-list').innerHTML = products.map(p => `<div class="card" onclick="openOrder('${p.name}', '${up25(p.price)}', '${p.type}')"><img src="${p.img}"><div class="p-info"><div class="title"><b>${p.name}</b></div><div class="price">${up25(p.price)} so'm</div></div></div>`).join(''); }
    let selectedP = {};
    function openOrder(name, price, type) {
        selectedP = {name, price, rawPrice: price};
        document.getElementById('m-title').innerText = name;
        document.getElementById('m-price').innerText = price + " so'm";
        const s = document.getElementById('p-size');
        if(type==="clothing") s.innerHTML = ["S","M","L","XL","XXL"].map(x=>`<option>${x}</option>`).join('');
        else if(type==="shoes") s.innerHTML = ["38","39","40","41","42","43","44"].map(x=>`<option>${x}</option>`).join('');
        else s.innerHTML = "<option>Standart</option>";
        document.getElementById('order-modal').style.display = 'flex';
    }
    function copyCard() { navigator.clipboard.writeText(document.getElementById('card-num').innerText); tg.showAlert("Nusxalandi!"); }
    
    function checkPromo() {
        const val = document.getElementById('promo-code').value.toUpperCase();
        let p = parseInt(selectedP.rawPrice.replace(/\D/g, ''));
        if(val.startsWith("RUSLAN") && val.length > 6) {
            let d = Math.round(p * 0.75);
            let formatted = d.toLocaleString();
            document.getElementById('m-price').innerHTML = `<del style="color:red; font-size:15px;">${selectedP.rawPrice}</del> ${formatted} so'm`;
            selectedP.finalPrice = formatted;
        } else { 
            document.getElementById('m-price').innerText = selectedP.rawPrice + " so'm"; 
            delete selectedP.finalPrice; 
        }
    }

    function sendOrder() {
        const user = JSON.parse(localStorage.getItem('ruslan_user'));
        const total = selectedP.finalPrice || selectedP.rawPrice;
        localStorage.setItem('my_order', JSON.stringify({name: selectedP.name, date: Date.now(), status: "waiting"}));
        const text = `💳 TO'LOV QILINDI\n📦: ${selectedP.name}\n💰: ${total} so'm\n📏: ${document.getElementById('p-size').value}\n👤: ${user.name}\n📞: ${user.phone}\n\n(Iltimos, tekshirib tasdiqlang!)`;
        window.location.href = `https://t.me/Ruslanbek20119?text=${encodeURIComponent(text)}`;
    }
    
    function updateStatus() {
        const order = JSON.parse(localStorage.getItem('my_order'));
        const container = document.getElementById('order-status-list');
        if(!order) { container.innerHTML = "<p style='text-align:center;'>Buyurtma yo'q</p>"; return; }
        
        if(order.status === "rejected") {
            container.innerHTML = `<div class="status-box" style="border-left: 5px solid var(--red);">
                <b>${order.name}</b><br>
                <span style="color:var(--red); font-weight:bold;">❌ To'lov tasdiqlanmadi</span><br>
                <small>Admin to'lovni rad etdi. Iltimos, qaytadan buyurtma bering.</small><br><br>
                <button onclick="localStorage.removeItem('my_order'); showPage('shop', document.querySelectorAll('.nav-item')[0])" style="background:var(--red); color:white; border:none; padding:8px; border-radius:8px;">Qaytadan buyurtma berish</button>
            </div>`;
            return;
        }

        if(order.status === "received") {
            container.innerHTML = `<div class="status-box" style="border-left: 5px solid var(--green);">
                <b>${order.name}</b><br>
                <span style="color:var(--green); font-weight:bold;">✅ Yetkazib berildi!</span><br>
                <small>Xaridingiz uchun rahmat. Buyurtma yakunlandi.</small><br><br>
                <button onclick="localStorage.removeItem('my_order'); showPage('shop', document.querySelectorAll('.nav-item')[0])" style="background:var(--main); color:white; border:none; padding:8px; border-radius:8px;">Yangi buyurtma</button>
            </div>`;
            return;
        }

        if(order.status === "confirmed") {
            container.innerHTML = `<div class="status-box" style="border-left: 5px solid var(--green);">
                <b>${order.name}</b><br>
                <span style="color:var(--green); font-weight:bold;">🚀 Tasdiqlandi. Xitoydan yo'lga chiqdi 🇨🇳</span><br>
                <small style="color:#888;">Buyurtma vaqti: ${new Date(order.date).toLocaleString()}</small>
                <div style="margin-top:10px; padding:10px; background:#f9f9f9; border-radius:8px;">
                    <small>Admin boshqaruvi (GET777):</small><br>
                    <input type="text" id="admin-code-input" placeholder="Kod..." style="width:50%; padding:5px;">
                    <button onclick="checkAdminCode()">OK</button>
                </div>
            </div>`;
            return;
        }

        const farqMinut = Math.floor((Date.now() - order.date) / (1000 * 60));
        let st, rang, belgi;
        if (farqMinut < 120) { st = "To'lov tekshirilmoqda..."; rang = "var(--orange)"; belgi = "⏳"; }
        else if (farqMinut >= 120 && farqMinut < 4320) { st = "Tasdiqlandi. Xitoydan yo'lga chiqdi 🇨🇳"; rang = "var(--green)"; belgi = "🚀"; }
        else { st = "O'zbekistonga kelmoqda 🇺🇿"; rang = "var(--blue)"; belgi = "🚛"; }

        container.innerHTML = `<div class="status-box" style="border-left: 5px solid ${rang};">
            <b>${order.name}</b><br>
            <span style="color:${rang}; font-weight:bold;">${belgi} ${st}</span><br>
            <small style="color:#888;">Buyurtma vaqti: ${new Date(order.date).toLocaleString()}</small>
            
            <div style="margin-top:15px; background:#f0f0f0; padding:10px; border-radius:8px; border: 1px solid #ddd;">
                <p style="font-size:10px; margin:0 0 5px 0; color:#444;"><b>Admin uchun boshqaruv:</b></p>
                <input type="text" id="admin-code-input" placeholder="Kodni kiriting..." style="width:60%; padding:6px; font-size:11px; border:1px solid #ccc; border-radius:4px;">
                <button onclick="checkAdminCode()" style="padding:7px; font-size:10px; background:var(--main); color:white; border:none; border-radius:4px; cursor:pointer;">OK</button>
                <div style="margin-top:5px; font-size:9px; color:#666;">
                    Tasdiqlash: <b>OK777</b> | Rad: <b>XATO777</b> | Qabul: <b>GET777</b> | Bekor: <b>DELETE777</b>
                </div>
            </div>
        </div>`;
    }

    function checkAdminCode() {
        const codeInput = document.getElementById('admin-code-input');
        const code = codeInput.value.toUpperCase();
        let order = JSON.parse(localStorage.getItem('my_order'));
        
        if(code === "XATO777") {
            order.status = "rejected";
            localStorage.setItem('my_order', JSON.stringify(order));
            tg.showAlert("To'lov rad etildi!");
        } 
        else if(code === "OK777") {
            order.status = "confirmed";
            localStorage.setItem('my_order', JSON.stringify(order));
            tg.showAlert("Muvaffaqiyatli tasdiqlandi!");
        } 
        else if(code === "GET777") {
            order.status = "received";
            localStorage.setItem('my_order', JSON.stringify(order));
            tg.showAlert("Buyurtma qabul qilingan deb belgilandi!");
        }
        else if(code === "DELETE777") {
            localStorage.removeItem('my_order');
            tg.showAlert("Buyurtma butunlay o'chirildi!");
            showPage('shop', document.querySelectorAll('.nav-item')[0]);
            return;
        }
        else {
            tg.showAlert("Noto'g'ri kod!");
            return;
        }
        updateStatus();
    }

    function showPage(p, b) {
        document.getElementById('shop-page').style.display = p === 'shop' ? 'block' : 'none';
        document.getElementById('orders-page').style.display = p === 'orders' ? 'block' : 'none';
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        if(b) b.classList.add('active'); 
        if(p === 'orders') updateStatus();
    }
    function closeModal() { document.getElementById('order-modal').style.display='none'; }
</script>
</body>
</html>
