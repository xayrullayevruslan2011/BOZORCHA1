<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruslan Market | Full Products</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main: #7f46f0; --orange: #ff9800; --green: #28a745; --blue: #007bff; --red: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
        
        #auth-page { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 320px; text-align: center; }
        .inp { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; outline: none; }
        .btn-reg { width: 100%; padding: 15px; background: var(--main); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; }
        .card img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
        .p-info { padding: 10px; }
        .price { color: #000; font-weight: bold; font-size: 15px; }
        .title { font-size: 13px; color: #444; height: 35px; overflow: hidden; margin-bottom: 5px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { border: none; background: none; font-size: 11px; color: #666; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .active { color: var(--main); font-weight: bold; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: #fff; width: 100%; max-width: 800px; border-radius: 20px; overflow: hidden; display: flex; flex-direction: row; max-height: 90vh; }
        .m-left { flex: 1.2; background: #fff; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .m-left img { width: 100%; max-height: 400px; object-fit: contain; }
        .m-right { flex: 1; padding: 20px; display: flex; flex-direction: column; border-left: 1px solid #eee; overflow-y: auto; }

        @media (max-width: 600px) {
            .modal-content { flex-direction: column; }
            .m-left { flex: none; height: 250px; }
            .m-right { border-left: none; border-top: 1px solid #eee; padding: 15px; }
            .container { grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
        }

        .uzum-price-box { background: #f8f8f8; padding: 12px; border-radius: 12px; margin: 10px 0; }
        .tg-style-box { text-align: left; background: #fff; border-radius: 12px; }
        .tg-style-box p { margin: 8px 0; font-size: 14px; line-height: 1.4; }
        .status-box { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--orange); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="auth-page" style="display: none;">
    <div class="auth-card">
        <h2 style="color: var(--main);">Xush kelibsiz!</h2>
        <input type="text" id="reg-name" class="inp" placeholder="Ismingiz">
        <input type="tel" id="reg-phone" class="inp" placeholder="Telefon raqamingiz">
        <button class="btn-reg" onclick="saveUser()">Kirish</button>
    </div>
</div>

<header><b>RUSLAN MARKET</b></header>

<div id="shop-page"><div class="container" id="product-list"></div></div>
<div id="orders-page" style="display:none; padding: 20px;">
    <h3>📦 Buyurtmalarim</h3>
    <div id="order-status-list"></div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="showPage('shop', this)"><span>🛍</span>Do'kon</button>
    <button class="nav-item" onclick="showPage('orders', this)"><span>📦</span>Buyurtmalar</button>
</div>

<div id="order-modal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <div class="m-left"><img id="m-img" src=""></div>
        <div id="m-right-panel" class="m-right">
            </div>
    </div>
</div>

        {name: "Butsi CR7", price: 250000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=955f5a96ef0407a40036c57870d8a26858dc1de1-9147490-images-thumbs&n=13"},
        {name: "Charm Kasholok", price: 60000, type: "other", img: "https://avatars.mds.yandex.net/i?id=c946c87f9186063f371d28edfd551675f5b367ee-12321292-images-thumbs&n=13"},
        {name: "Jinsi Kurtka", price: 180000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=2806b3df83565217f518bc6d28669dd0b469da71-12346171-images-thumbs&n=13"},
        {name: "Ayollar Tufli", price: 195000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=e2848e85ba6b48b1ae981456bd1625821b9bd0d8-9266608-images-thumbs&n=13"},

        {name: "Powerbank Mi", price: 120000, type: "other", img: "https://avatars.mds.yandex.net/i?id=d14c1345a79ae8b7cf5e0079f58dad7a46615c5d-4080206-images-thumbs&n=13"},
        {name: "Real Madrid forma", price: 95000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=91dd766c7da0e17bca09609db0d0ff523bb867ee-5646461-images-thumbs&n=13"},
        {name: "Velosiped", price: 600000, type: "other", img: "https://avatars.mds.yandex.net/i?id=ee2185a8c49748952fb1e3e616c44a156778aab5-5668729-images-thumbs&n=13"},
        {name: "Kargo Shim", price: 155000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=527c6bf4959b7393e145d6331eb86d1997330a50-12190079-images-thumbs&n=13"},
        {name: "Zontik", price: 50000, type: "other", img: "https://avatars.mds.yandex.net/i?id=f95de4ef87a20fd80cb0e69b943300478b24de5d-8236365-images-thumbs&n=13"},
        {name: "Soch Fen", price: 100000, type: "other", img: "https://avatars.mds.yandex.net/i?id=cfb4f0cc27e67359417b63ee89935b1df007ce1e-5166135-images-thumbs&n=13"},
        {name: "Printercha", price: 95000, type: "other", img: "https://avatars.mds.yandex.net/i?id=4cbef11efd3ef5256645f41bc7445940bd2f73f-10108411-images-thumbs&n=13"},
        {name: "Fila Sneakers", price: 220000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=8234a6722a98b9f5722c181de9122965a81b52c0-5470361-images-thumbs&n=13"},
        {name: "Quloqchin", price: 30000, type: "other", img: "https://avatars.mds.yandex.net/i?id=07095e2b6bb3c1258f1bbe260580632124a5c502-5115418-images-thumbs&n=13"},
        {name: "Sandali", price: 80000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=e93e7e435d7594b6d12a37d39f75fdba38b22977-5642274-images-thumbs&n=13"},
        {name: "Mafiya o'yini", price: 35000, type: "other", img: "https://avatars.mds.yandex.net/i?id=edef3ffbc286e535ca0aff0694bdf475dc2021a0-5354907-images-thumbs&n=13"},
        {name: "Charm Qo'lqop", price: 55000, type: "other", img: "https://avatars.mds.yandex.net/i?id=c327df75519325dabc72349597d1129978a636c8-4577841-images-thumbs&n=13"}
    ];

    function up25(p) { return Math.round(p * 1.25).toLocaleString(); }
    
    window.onload = () => { 
        if (!localStorage.getItem('ruslan_user')) document.getElementById('auth-page').style.display = 'flex'; 
        renderProducts(); 
    }
    
    function saveUser() {
        const n = document.getElementById('reg-name').value, p = document.getElementById('reg-phone').value;
        if (n.length > 2 && p.length > 6) { 
            localStorage.setItem('ruslan_user', JSON.stringify({name:n, phone:p})); 
            document.getElementById('auth-page').style.display = 'none'; 
        }
    }

    function renderProducts() { 
        document.getElementById('product-list').innerHTML = products.map(p => `
            <div class="card" onclick="openOrder('${p.name}', '${up25(p.price)}', '${p.type}', '${p.img}')">
                <img src="${p.img}">
                <div class="p-info">
                    <div class="title">${p.name}</div>
                    <div class="price">${up25(p.price)} so'm</div>
                </div>
            </div>`).join(''); 
    }

    let selectedP = {};
    function openOrder(name, price, type, img) {
        selectedP = {name, price, img};
        const sOptions = type === "clothing" ? ["S","M","L","XL","XXL"] : (type === "shoes" ? ["38","39","40","41","42","43","44"] : ["Standart"]);
        
        document.getElementById('m-img').src = img;
        document.getElementById('m-right-panel').innerHTML = `
            <h2 style="margin:0; font-size: 18px;">${name}</h2>
            <div class="uzum-price-box">
                <div style="font-size: 22px; font-weight: bold;">${price} so'm</div>
                <small style="color: var(--green);">Tezkor yetkazib berish ✅</small>
            </div>
            <label style="font-size:11px; color:#666;">O'lchamni tanlang:</label>
            <select id="p-size" class="inp">${sOptions.map(x=>`<option>${x}</option>`).join('')}</select>
            <input type="text" id="promo-code" class="inp" placeholder="Promokod">
            <button id="pay-btn" onclick="showPaymentStep()" class="btn-reg" style="margin-top:10px;">Xarid qilish</button>
            <button onclick="closeModal()" style="background:none; border:none; color:#999; margin-top:10px; font-size:12px; cursor:pointer;">Yopish</button>
        `;
        document.getElementById('order-modal').style.display = 'flex';
    }

    function showPaymentStep() {
        const paymentId = Math.floor(Math.random() * 90000) + 10000;
        const size = document.getElementById('p-size').value;
        
        document.getElementById('m-right-panel').innerHTML = `
            <div class="tg-style-box">
                <p>✅ <b>To'lov miqdori qabul qilindi!</b></p>
                <hr style="border:0; border-top:1px solid #eee;">
                <p>🆔 <b>To'lov ID:</b> ${paymentId}</p>
                <p>💰 <b>Miqdori:</b> ${selectedP.price} so'm</p>
                <p>💳 <b>To'lov uchun:</b> <br>
                   <b style="font-size:16px; color:var(--blue);">4073 4200 6735 5457</b> 
                   <button onclick="copyCard()" style="border:none; background:none; color:var(--main); cursor:pointer; font-weight:bold;">[Nusxa]</button>
                </p>
                <p>👤 <b>I.F.O:</b> RUSLAN M.</p>
                <p>⏰ <b>To'lovni Amalga oshirish uchun berilgan vaqt:</b> 5 daqiqa</p>
                <br>
                <p style="font-size: 11px; color: #888;">❕ To'lovni 10 Soniya Kutib, Keyin Amalga Oshirishingiz Mumkin.</p>
                <p style="font-size: 11px; color: var(--green);">✅ To'lov qilganingizdan so'ng To'lov avtomatik qabul qilinadi.</p>
                <button id="final-btn" onclick="sendOrder('${paymentId}', '${size}')" class="btn-reg">To'lov qildim 💰</button>
            </div>
        `;
    }

    async function sendOrder(id, size) {
        const user = JSON.parse(localStorage.getItem('ruslan_user'));
        const btn = document.getElementById('final-btn');
        btn.innerText = "Yuborilmoqda..."; btn.disabled = true;

        // Botga yuboriladigan formatlangan matn
        const botMsg = `✅ To'lov miqdori qabul qilindi!\n\n🆔 To'lov ID: ${id}\n💰 Miqdori: ${selectedP.price} so'm\n💳 Karta: 4073 4200 6735 5457\n👤 I.F.O: RUSLAN M.\n\n🛍 Mahsulot: ${selectedP.name}\n📏 O'lcham: ${size}\n👤 Mijoz: ${user.name}\n📞 Tel: ${user.phone}\n\nTo'lov qildim 💰`;

        try {
            // Backendga yuborish
            await fetch(`${BACKEND_URL}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_name: user.name, phone: user.phone, 
                    product: selectedP.name, price: selectedP.price, 
                    size: size, order_id: id, status: "waiting"
                })
            });
            
            localStorage.setItem('my_order', JSON.stringify({name: selectedP.name, date: Date.now(), status: "waiting"}));
            
            // Botga yo'naltirish
            window.location.href = `https://t.me/Ruslanbek20119?text=${encodeURIComponent(botMsg)}`;
            
        } catch (e) {
            // Xatolik bo'lsa ham botga yuboraveradi
            window.location.href = `https://t.me/Ruslanbek20119?text=${encodeURIComponent(botMsg)}`;
        }
    }

    function closeModal() { document.getElementById('order-modal').style.display='none'; }
    function copyCard() { navigator.clipboard.writeText("4073420067355457"); tg.showAlert("Nusxalandi!"); }

    function showPage(p, b) {
        document.getElementById('shop-page').style.display = p === 'shop' ? 'block' : 'none';
        document.getElementById('orders-page').style.display = p === 'orders' ? 'block' : 'none';
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        if(b) b.classList.add('active'); 
        if(p === 'orders') updateStatus();
    }

    function updateStatus() {
        const order = JSON.parse(localStorage.getItem('my_order')), container = document.getElementById('order-status-list');
        if(!order) { container.innerHTML = "<p style='text-align:center;'>Hozircha buyurtmalar yo'q</p>"; return; }
        let st = "To'lov kutilmoqda...", rang = "var(--orange)";
        if(order.status === "confirmed") { st = "Yo'lga chiqdi 🚀"; rang = "var(--green)"; }
        if(order.status === "rejected") { st = "Rad etildi ❌"; rang = "var(--red)"; }
        container.innerHTML = `
            <div class="status-box" style="border-left:5px solid ${rang}">
                <b>${order.name}</b><br>
                <span style="color:${rang}">${st}</span><br>
                <input type="text" id="admin-code-input" placeholder="Kod" style="margin-top:8px; padding:5px; width:80px;">
                <button onclick="checkAdminCode()" style="margin-left:5px;">OK</button>
            </div>`;
    }

    function checkAdminCode() {
        const code = document.getElementById('admin-code-input').value.toUpperCase();
        let order = JSON.parse(localStorage.getItem('my_order'));
        if(code === "OK777") order.status = "confirmed";
        else if(code === "XATO777") order.status = "rejected";
        else if(code === "DELETE777") { localStorage.removeItem('my_order'); showPage('shop'); return; }
        else { tg.showAlert("Kod noto'g'ri!"); return; }
        localStorage.setItem('my_order', JSON.stringify(order)); 
        updateStatus();
    }
</script>
</body>
</html>
