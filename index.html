<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruslan Market | Uzum Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #7f46f0; --bg: #f4f5f7; --white: #ffffff; --gray: #8b8e99; --text: #1f2026; --orange: #ff9800; --red: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); padding-bottom: 70px; overflow-x: hidden; }
        
        .header-search { background: var(--white); padding: 10px 15px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #e5e7ea; }
        .search-box { background: #edeff2; border-radius: 10px; display: flex; align-items: center; padding: 8px 12px; }
        .search-box input { border: none; background: transparent; margin-left: 10px; width: 100%; outline: none; font-size: 14px; }

        .page { display: none; padding: 15px; animation: fadeIn 0.2s ease; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: var(--white); border-radius: 12px; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .p-info { padding: 10px; flex-grow: 1; }
        .price { font-weight: bold; font-size: 15px; margin: 5px 0; color: var(--text); }
        .title { font-size: 12px; color: #4d4e59; height: 32px; overflow: hidden; line-height: 1.3; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--white); display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e5e7ea; z-index: 2000; }
        .nav-item { border: none; background: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
        .nav-item.active { color: var(--main); }

        .menu-list { background: var(--white); border-radius: 12px; margin-top: 10px; overflow: hidden; }
        .menu-item { padding: 15px; border-bottom: 1px solid #f4f5f7; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .menu-item div { display: flex; align-items: center; }
        .menu-item i { margin-right: 12px; width: 20px; color: #4d4e59; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3000; align-items: flex-end; }
        .modal-content { background: var(--white); width: 100%; padding: 20px; border-radius: 20px 20px 0 0; box-sizing: border-box; }
        .card-box { background: #f3f0ff; border: 1px dashed var(--main); padding: 15px; border-radius: 12px; margin: 15px 0; text-align: center; }
        .btn-pay { width: 100%; padding: 15px; background: var(--main); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .status-box { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--orange); }
    </style>
</head>
<body>

    <div id="auth-page" style="display: none; position: fixed; inset: 0; background: #fff; z-index: 5000; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
        <h2 style="color: var(--main);">Xush kelibsiz!</h2>
        <input type="text" id="reg-name" style="width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd;" placeholder="Ismingiz">
        <input type="tel" id="reg-phone" style="width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd;" placeholder="Telefon raqamingiz">
        <button onclick="saveUser()" style="width: 100%; padding: 15px; background: var(--main); color: #fff; border: none; border-radius: 12px; font-weight: bold;">Do'konga kirish</button>
    </div>

    <div class="header-search">
        <div class="search-box"><i class="fa fa-search" style="color: var(--gray);"></i><input type="text" id="searchInput" oninput="filterProducts()" placeholder="Mahsulotlarni qidirish..."></div>
    </div>

    <div id="home" class="page active-page"><h3 style="margin-top: 0;">Foyda xitlari</h3><div class="container" id="product-list"></div></div>
    
    <div id="catalog" class="page">
        <h3>Turkumlar</h3>
        <div class="menu-list">
            <div class="menu-item"><div><i class="fa fa-shirt"></i> Kiyimlar</div><i class="fa fa-chevron-right"></i></div>
            <div class="menu-item"><div><i class="fa fa-shoe-prints"></i> Poyabzallar</div><i class="fa fa-chevron-right"></i></div>
            <div class="menu-item"><div><i class="fa fa-laptop"></i> Elektronika</div><i class="fa fa-chevron-right"></i></div>
            <div class="menu-item"><div><i class="fa fa-house"></i> Uy ro'zg'or</div><i class="fa fa-chevron-right"></i></div>
        </div>
    </div>

    <div id="cart" class="page">
        <h3>Savat (Buyurtmalar)</h3>
        <div id="order-status-list"></div>
        <div id="cart-empty" style="text-align: center; margin-top: 50px;">
            <i class="fa fa-shopping-bag" style="font-size: 50px; color: #e5e7ea;"></i>
            <p style="color: var(--gray);">Hozircha buyurtmalar yo'q</p>
        </div>
    </div>

    <div id="profile" class="page">
        <div style="display: flex; align-items: center; padding: 20px 0;"><div style="width: 60px; height: 60px; background: var(--main); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; color: white;"><i class="fa fa-user"></i></div><div style="margin-left: 15px;"><b id="display-name">Foydalanuvchi</b><br><small id="display-phone" style="color: var(--gray);"></small></div></div>
        <div class="menu-list">
            <div class="menu-item" onclick="openPage('cart', document.querySelectorAll('.nav-item')[2])"><div><i class="fa fa-box"></i> Buyurtmalarim</div><i class="fa fa-chevron-right"></i></div>
            <div class="menu-item" onclick="localStorage.clear(); location.reload();"><div><i class="fa fa-right-from-bracket"></i> Chiqish</div></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="openPage('home', this)"><i class="fa fa-house"></i><span>Bosh sahifa</span></button>
        <button class="nav-item" onclick="openPage('catalog', this)"><i class="fa fa-magnifying-glass"></i><span>Katalog</span></button>
        <button class="nav-item" onclick="openPage('cart', this)"><i class="fa fa-bag-shopping"></i><span>Savat</span></button>
        <button class="nav-item" onclick="openPage('profile', this)"><i class="fa fa-user"></i><span>Profil</span></button>
    </div>

    <div id="order-modal" class="modal" onclick="if(event.target==this) closeModal()">
        <div class="modal-content">
            <h3 id="m-title"></h3>
            <p id="m-price" style="font-size: 20px; color: var(--main); font-weight: bold;"></p>
            <div class="card-box">
                <small>To'lov uchun karta (Humo):</small><br>
                <b id="card-num" style="font-size: 18px;">4073420067355457</b><br>
                <span style="color: var(--main); font-weight: bold;">Gulzebo Xolboeva</span><br>
                <button onclick="copyCard()" style="font-size:12px; margin-top:8px; cursor:pointer; background:#eee; border:1px solid #ccc; padding:4px 10px; border-radius:5px;">Nusxa olish</button>
            </div>
            <select id="p-size" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin-bottom:15px;"></select>
            <button class="btn-pay" onclick="sendOrder()">To'lovni tasdiqlash</button>
        </div>
    </div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    const BACKEND_URL = "https://bozorcha1.onrender.com";

    const products = [
        {name: "Qishki Kurtka Premium", price: 200000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=70951574663cbae2ac73b1f8a4f8a2ea3c06527a-9099023-images-thumbs&n=13"},
        {name: "Nike Air Max 270", price: 280000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=f1e7218c18bd5095bc3e5696f25fb4348235580a-4322265-images-thumbs&n=13"},
        {name: "Polo Dvoyka", price: 150000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=b8b693d50f4c2381d985a1c8f33d3cb0be4ca464-4027983-images-thumbs&n=13"},

        {name: "Tufli Charm", price: 100000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=a0fe76efd8801116ec5dfd344f6f904cf2b54d3d-5236416-images-thumbs&n=13"},
        {name: "Hudi Oversize", price: 130000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=0820d25df2e30ed233e70414ddf08a298e916183-5307529-images-thumbs&n=13"},
        {name: "Adidas Yeezy", price: 200000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=30787d09a791c5c4c45821dd2120c2d8463c1ce0-5235999-images-thumbs&n=13"},
        {name: "suvarka aparat", price: 55000, type: "other", img: "https://avatars.mds.yandex.net/i?id=db3e3ea838e7139ba301d62bf81326cc1c84cb13-5279204-images-thumbs&n=13"},
        {name: "Charm Remen", price: 70000, type: "other", img: "https://avatars.mds.yandex.net/i?id=cc3213e0ac2fa192d5d29ae8c4eaa636f2ab6545-5388624-images-thumbs&n=13"},
        {name: "Rolex Watch", price: 350000, type: "other", img: "https://cdn1.ozone.ru/s3/multimedia-1-f/c600/7106545059.jpg"},

        {name: "Sportivka Nike", price: 210000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=4e2ad4cb6f8bb2148e1372db2b732f36aad9cf56-5334272-images-thumbs&n=13"},
        {name: "Sviter Kashmir", price: 120000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=d09084e02bca0238a10123c4b8b63907c48a67fe-5876970-images-thumbs&n=13"},
        {name: "etik detiskiy", price: 65000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=2de6a0abd6d4c21e0652d8d6ab8aa9b9ac5c3a3e-5088700-images-thumbs&n=13"},
        {name: "Termos 1L", price: 35000, type: "other", img: "https://avatars.mds.yandex.net/i?id=cb19d8d4f51449e1d7b2f223701c0cceac170f06-5354769-images-thumbs&n=13"},
        {name: "etik qizbolalarga", price: 45000, type: "other", img: "https://avatars.mds.yandex.net/i?id=09c35d96d8de2db1debbc11dd510bd89d1ac157c-5165563-images-thumbs&n=13"},
        {name: "Slipper", price: 40000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=f7eca6059ad7eeb0fd7275ecb4ead8e1b1d3a394-16477287-images-thumbs&n=13"},
        {name: "Paypoq (12 juft)", price: 45000, type: "other", img: "https://avatars.mds.yandex.net/i?id=e62cd2900f57009005890eca9965dd170b756b56-5233320-images-thumbs&n=13"},
        {name: "Gucci Glasses", price: 125000, type: "other", img: "https://avatars.mds.yandex.net/i?id=79320094fd45192d98c11a4c562cf841230b4303-13095363-images-thumbs&n=13"},
        {name: "Mayka Oq", price: 30000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=dea2ae40a8886506b1f6bcd5df7d8a09a16a4c8d-5083805-images-thumbs&n=13"},
        {name: "Palto Klassik", price: 280000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=4b7e2423be88c3c91c2288bda8b7f530bed31428-11543356-images-thumbs&n=13"},
        {name: "Grey Svitshot", price: 110000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=a52fa236d5e23058498f47845134381620076a0c-4817585-images-thumbs&n=13"},
        {name: "Butsi CR7", price: 250000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=955f5a96ef0407a40036c57870d8a26858dc1de1-9147490-images-thumbs&n=13"},
        {name: "Charm Kasholok", price: 60000, type: "other", img: "https://avatars.mds.yandex.net/i?id=c946c87f9186063f371d28edfd551675f5b367ee-12321292-images-thumbs&n=13"},
        {name: "Jinsi Kurtka", price: 180000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=2806b3df83565217f518bc6d28669dd0b469da71-12346171-images-thumbs&n=13"},
        {name: "Ayollar Tufli", price: 195000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=e2848e85ba6b48b1ae981456bd1625821b9bd0d8-9266608-images-thumbs&n=13"},
        {name: "Shapka Sharf", price: 55000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=da6492ab1e012dfdb6f14d21e1e773014990bfc2-12323207-images-thumbs&n=13"},
        {name: "Powerbank Mi", price: 120000, type: "other", img: "https://avatars.mds.yandex.net/i?id=d14c1345a79ae8b7cf5e0079f58dad7a46615c5d-4080206-images-thumbs&n=13"},
        {name: "Real Madrid forma", price: 95000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=91dd766c7da0e17bca09609db0d0ff523bb867ee-5646461-images-thumbs&n=13"},
        {name: "velosiped", price: 600000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=ee2185a8c49748952fb1e3e616c44a156778aab5-5668729-images-thumbs&n=13"},
        {name: "Kargo Shim", price: 155000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=527c6bf4959b7393e145d6331eb86d1997330a50-12190079-images-thumbs&n=13"},
        {name: "Zontik", price: 50000, type: "other", img: "https://avatars.mds.yandex.net/i?id=f95de4ef87a20fd80cb0e69b943300478b24de5d-8236365-images-thumbs&n=13"},
        {name: "Soch Fen", price: 100000, type: "other", img: "https://avatars.mds.yandex.net/i?id=cfb4f0cc27e67359417b63ee89935b1df007ce1e-5166135-images-thumbs&n=13"},
        {name: "printercha", price: 95000, type: "other", img: "https://avatars.mds.yandex.net/i?id=4cbef11efd3ef5b256645f41bc7445940bd2f73f-10108411-images-thumbs&n=13"},
        {name: "Fila Sneakers", price: 220000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=8234a6722a98b9f5722c181de9122965a81b52c0-5470361-images-thumbs&n=13"},
        {name: "quloqchin", price: 30000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=07095e2b6bb3c1258f1bbe260580632124a5c502-5115418-images-thumbs&n=13"},
        {name: "Sandali", price: 80000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=e93e7e435d7594b6d12a37d39f75fdba38b22977-5642274-images-thumbs&n=13"},
        {name: "mafiya o'yini", price: 35000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=edef3ffbc286e535ca0aff0694bdf475dc2021a0-5354907-images-thumbs&n=13"},
        {name: "Charm Qo'lqop", price: 55000, type: "other", img: "https://avatars.mds.yandex.net/i?id=c327df75519325dabc72349597d1129978a636c8-4577841-images-thumbs&n=13"}
    ];

    window.onload = () => {
        const user = JSON.parse(localStorage.getItem('ruslan_user'));
        if (!user) document.getElementById('auth-page').style.display = 'flex';
        else {
            document.getElementById('display-name').innerText = user.name;
            document.getElementById('display-phone').innerText = user.phone;
        }
        renderProducts(products);
    }

    function saveUser() {
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;
        if (name.length > 2 && phone.length > 6) {
            localStorage.setItem('ruslan_user', JSON.stringify({name, phone}));
            location.reload();
        }
    }

    function renderProducts(list) {
        document.getElementById('product-list').innerHTML = list.map(p => `
            <div class="card" onclick="openOrder('${p.name}', ${Math.round(p.price * 1.25)}, '${p.type}')">
                <img src="${p.img}"><div class="p-info"><div class="title">${p.name}</div><div class="price">${(Math.round(p.price * 1.25)).toLocaleString()} so'm</div></div>
            </div>`).join('');
    }

    function openPage(name, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(name).classList.add('active-page');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        if (name === 'cart') updateStatus();
    }

    let selectedP = {};
    function openOrder(name, price, type) {
        selectedP = {name, price};
        document.getElementById('m-title').innerText = name;
        document.getElementById('m-price').innerText = price.toLocaleString() + " so'm";
        const s = document.getElementById('p-size');
        if(type==="clothing") s.innerHTML = ["S","M","L","XL","XXL"].map(x=>`<option>${x}</option>`).join('');
        else if(type==="shoes") s.innerHTML = ["38","39","40","41","42","43","44"].map(x=>`<option>${x}</option>`).join('');
        else s.innerHTML = "<option>Standart</option>";
        document.getElementById('order-modal').style.display = 'flex';
    }

    function copyCard() {
        navigator.clipboard.writeText("4073420067355457");
        tg.showAlert("Karta raqami nusxalandi!");
    }

    async function sendOrder() {
        const user = JSON.parse(localStorage.getItem('ruslan_user'));
        const size = document.getElementById('p-size').value;

        try {
            await fetch(`${BACKEND_URL}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_name: user.name, phone: user.phone, product: selectedP.name, price: selectedP.price.toString(), size: size })
            });
        } catch (e) { console.log(e); }

        localStorage.setItem('my_order', JSON.stringify({name: selectedP.name, date: Date.now(), status: "waiting"}));
        const text = `💳 TO'LOV QILINDI\n📦: ${selectedP.name}\n💰: ${selectedP.price.toLocaleString()} so'm\n📏: ${size}\n👤: ${user.name}\n📞: ${user.phone}\n\nKarta: 4073420067355457 (Gulzebo Xolboeva)`;
        window.location.href = `https://t.me/Ruslanbek20119?text=${encodeURIComponent(text)}`;
    }

    function updateStatus() {
        const order = JSON.parse(localStorage.getItem('my_order'));
        const container = document.getElementById('order-status-list');
        if(!order) { document.getElementById('cart-empty').style.display = 'block'; container.innerHTML = ""; return; }
        document.getElementById('cart-empty').style.display = 'none';
        
        let st, rang, belgi;
        if (order.status === "waiting") { st = "To'lov tekshirilmoqda..."; rang = "var(--orange)"; belgi = "⏳"; }
        else if (order.status === "confirmed") { st = "Xitoydan yo'lga chiqdi 🇨🇳"; rang = "var(--green)"; belgi = "🚀"; }
        else if (order.status === "rejected") { st = "To'lov rad etildi ❌"; rang = "var(--red)"; belgi = "🚫"; }
        else { st = "Yetkazib berildi ✅"; rang = "var(--blue)"; belgi = "📦"; }

        container.innerHTML = `<div class="status-box" style="border-left: 5px solid ${rang};">
            <b>${order.name}</b><br><span style="color:${rang}; font-weight:bold;">${belgi} ${st}</span><br>
            <div style="margin-top:10px;"><input type="text" id="admin-code-input" style="padding:8px; width:60%; border:1px solid #ddd; border-radius:8px;" placeholder="Kod..."><button onclick="checkAdminCode()" style="padding:8px; background:var(--main); color:white; border:none; border-radius:8px; cursor:pointer;">OK</button></div>
        </div>`;
    }

    function checkAdminCode() {
        const code = document.getElementById('admin-code-input').value.toUpperCase();
        let order = JSON.parse(localStorage.getItem('my_order'));
        if(code === "OK777") order.status = "confirmed";
        else if(code === "XATO777") order.status = "rejected";
        else if(code === "GET777") order.status = "received";
        else { tg.showAlert("Xato kod!"); return; }
        localStorage.setItem('my_order', JSON.stringify(order));
        updateStatus();
    }

    function closeModal() { document.getElementById('order-modal').style.display='none'; }
    function filterProducts() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        renderProducts(products.filter(p => p.name.toLowerCase().includes(term)));
    }
</script>
</body>
</html>
