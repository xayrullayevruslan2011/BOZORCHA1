<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruslan Market | Premium Wheel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #7f46f0; --bg: #f4f5f7; --white: #ffffff; --gray: #8b8e99; --text: #1f2026; --orange: #ff9800; --red: #dc3545; --green: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); padding-bottom: 70px; overflow-x: hidden; }
        
        /* Header & Pages */
        .header-search { background: var(--white); padding: 10px 15px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #e5e7ea; }
        .search-box { background: #edeff2; border-radius: 10px; display: flex; align-items: center; padding: 8px 12px; }
        .search-box input { border: none; background: transparent; margin-left: 10px; width: 100%; outline: none; font-size: 14px; }
        .page { display: none; padding: 15px; animation: fadeIn 0.2s ease; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Grid & Cards */
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: var(--white); border-radius: 12px; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .p-info { padding: 10px; flex-grow: 1; }
        .price { font-weight: bold; font-size: 15px; margin: 5px 0; color: var(--text); }
        .title { font-size: 12px; color: #4d4e59; height: 32px; overflow: hidden; line-height: 1.3; }

        /* Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--white); display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e5e7ea; z-index: 2000; }
        .nav-item { border: none; background: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
        .nav-item.active { color: var(--main); }

        /* Wheel Styles */
        #wheel-wrapper { position: relative; width: 300px; height: 300px; margin: 20px auto; }
        #canvas { width: 100%; height: 100%; transform: rotate(0deg); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 30px; height: 30px; background: var(--red); clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 100; border: 2px solid white; }
        .chance-badge { background: var(--main); color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; margin-bottom: 10px; display: inline-block; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3000; align-items: flex-end; }
        .modal-content { background: var(--white); width: 100%; padding: 20px; border-radius: 20px 20px 0 0; box-sizing: border-box; }
        .promo-box { background: #e8f5e9; border: 1px dashed var(--green); padding: 10px; border-radius: 8px; margin: 10px 0; text-align: center; color: var(--green); font-weight: bold; }
        .btn-pay { width: 100%; padding: 15px; background: var(--main); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-page" style="display: none; position: fixed; inset: 0; background: #fff; z-index: 5000; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
        <h2 style="color: var(--main);">Xush kelibsiz!</h2>
        <input type="text" id="reg-name" style="width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd;" placeholder="Ismingiz">
        <input type="tel" id="reg-phone" style="width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd;" placeholder="Telefon raqamingiz">
        <select id="reg-region" style="width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd;">
            <option value="">Hududni tanlang</option>
            <option>Toshkent</option><option>Andijon</option><option>Farg'ona</option><option>Namangan</option>
            <option>Samarqand</option><option>Buxoro</option><option>Xorazm</option><option>Surxondaryo</option>
            <option>Qashqadaryo</option><option>Jizzax</option><option>Sirdaryo</option><option>Navoiy</option>
        </select>
        <button onclick="saveUser()" style="width: 100%; padding: 15px; background: var(--main); color: #fff; border: none; border-radius: 12px; font-weight: bold;">Kirish</button>
    </div>

    <div class="header-search">
        <div class="search-box"><i class="fa fa-search" style="color: var(--gray);"></i><input type="text" id="searchInput" oninput="filterProducts()" placeholder="Qidiruv..."></div>
    </div>

    <div id="home" class="page active-page"><h3>Foyda xitlari</h3><div class="container" id="product-list"></div></div>

    <div id="lucky" class="page" style="text-align: center;">
        <h3>Omadli Baraban</h3>
        <div class="chance-badge">Imkoniyatlaringiz: <span id="chance-count">0</span> ta</div>
        <div id="wheel-wrapper">
            <div class="pointer"></div>
            <canvas id="canvas" width="300" height="300"></canvas>
        </div>
        <button id="spin-btn" onclick="spin()" style="padding: 15px 40px; background: var(--main); color: white; border: none; border-radius: 30px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 15px rgba(127,70,240,0.3);">AYLANTIRISH</button>
        <p style="font-size: 12px; color: var(--gray); margin-top: 20px;">
            🎁 Printercha yutish imkoniyati: 1% <br>
            ➕ Odam qo'shsangiz yoki xarid qilsangiz imkoniyat ko'payadi!
        </p>
    </div>

    <div id="cart" class="page">
        <h3>Savat / Holat</h3>
        <div id="order-status-list"></div>
        <div id="cart-empty" style="text-align: center; margin-top: 50px;"><i class="fa fa-shopping-bag" style="font-size: 50px; color: #eee;"></i><p>Buyurtmalar yo'q</p></div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="openPage('home', this)"><i class="fa fa-house"></i><span>Bosh sahifa</span></button>
        <button class="nav-item" onclick="openPage('lucky', this)"><i class="fa fa- DH-wheel"></i><i class="fa fa-clover"></i><span>Baraban</span></button>
        <button class="nav-item" onclick="openPage('cart', this)"><i class="fa fa-bag-shopping"></i><span>Savat</span></button>
    </div>

    <div id="order-modal" class="modal" onclick="if(event.target==this) closeModal()">
        <div class="modal-content">
            <h3 id="m-title"></h3>
            <div id="promo-display" class="promo-box" style="display: none;"></div>
            <p id="m-price" style="font-size: 20px; color: var(--main); font-weight: bold;"></p>
            <div style="background: #f3f0ff; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 10px;">
                <small>Humo Karta:</small><br><b>4073420067355457</b><br><small>Gulzebo Xolboeva</small>
            </div>
            <select id="p-size" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin-bottom:15px;"></select>
            <button class="btn-pay" onclick="sendOrder()">Tasdiqlash</button>
        </div>
    </div>

<script>
    let tg = window.Telegram.WebApp;
    const products = [
        {name: "Qishki Kurtka Premium", price: 200000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=70951574663cbae2ac73b1f8a4f8a2ea3c06527a-9099023-images-thumbs&n=13"},
        {name: "Nike Air Max 270", price: 280000, type: "shoes", img: "https://avatars.mds.yandex.net/i?id=f1e7218c18bd5095bc3e5696f25fb4348235580a-4322265-images-thumbs&n=13"},
        {name: "Printercha Smart", price: 150000, type: "other", img: "https://avatars.mds.yandex.net/i?id=4cbef11efd3ef5b256645f41bc7445940bd2f73f-10108411-images-thumbs&n=13"},
        {name: "Polo Dvoyka", price: 150000, type: "clothing", img: "https://avatars.mds.yandex.net/i?id=b8b693d50f4c2381d985a1c8f33d3cb0be4ca464-4027983-images-thumbs&n=13"}
    ];

    let user = JSON.parse(localStorage.getItem('ruslan_v2')) || null;
    const sectors = [
        {label: "10%", color: "#FFCC00", weight: 30},
        {label: "20%", color: "#FF9900", weight: 25},
        {label: "30%", color: "#7f46f0", weight: 20},
        {label: "40%", color: "#28a745", weight: 14},
        {label: "50%", color: "#dc3545", weight: 10},
        {label: "PRINTER", color: "#000000", weight: 1}
    ];

    window.onload = () => {
        if(!user) document.getElementById('auth-page').style.display='flex';
        else { 
            checkDailyChance();
            drawWheel();
            updateChanceDisplay();
        }
        renderProducts(products);
    };

    function saveUser() {
        const n = document.getElementById('reg-name').value;
        const p = document.getElementById('reg-phone').value;
        const r = document.getElementById('reg-region').value;
        if(n && p && r) {
            user = {name:n, phone:p, region:r, chances:1, lastSpin:null, promo:null};
            localStorage.setItem('ruslan_v2', JSON.stringify(user));
            location.reload();
        }
    }

    function checkDailyChance() {
        const today = new Date().toDateString();
        if(user.lastSpinDate !== today) {
            user.chances += 1;
            user.lastSpinDate = today;
            localStorage.setItem('ruslan_v2', JSON.stringify(user));
        }
    }

    function drawWheel() {
        const ctx = document.getElementById('canvas').getContext('2d');
        const arc = Math.PI / (sectors.length / 2);
        sectors.forEach((s, i) => {
            const angle = i * arc;
            ctx.fillStyle = s.color;
            ctx.beginPath();
            ctx.moveTo(150, 150);
            ctx.arc(150, 150, 145, angle, angle + arc);
            ctx.fill();
            ctx.save();
            ctx.translate(150, 150);
            ctx.rotate(angle + arc / 2);
            ctx.fillStyle = "white";
            ctx.font = "bold 16px Arial";
            ctx.fillText(s.label, 70, 5);
            ctx.restore();
        });
    }

    function spin() {
        if(user.chances <= 0) { tg.showAlert("Imkoniyat qolmadi! Buyurtma bering yoki 30 ta do'st qo'shing."); return; }
        
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;
        user.chances--;
        updateChanceDisplay();

        const rand = Math.random() * 100;
        let cumulative = 0;
        let winnerIndex = 0;
        for(let i=0; i<sectors.length; i++){
            cumulative += sectors[i].weight;
            if(rand <= cumulative) { winnerIndex = i; break; }
        }

        const deg = 3600 + (winnerIndex * (360/sectors.length)) + 15;
        document.getElementById('canvas').style.transform = `rotate(-${deg}deg)`;

        setTimeout(() => {
            const win = sectors[winnerIndex];
            const promo = Math.floor(100000 + Math.random() * 900000); // 6 xonali promo
            user.promo = { code: promo, value: win.label };
            localStorage.setItem('ruslan_v2', JSON.stringify(user));
            tg.showAlert(`Tabriklaymiz! Sizga ${win.label} yutug'i va ${promo} promo-kodi berildi!`);
            btn.disabled = false;
        }, 5000);
    }

    function updateChanceDisplay() { document.getElementById('chance-count').innerText = user.chances; }

    function openOrder(name, price) {
        document.getElementById('m-title').innerText = name;
        let finalPrice = Math.round(price * 1.25);
        
        if(user.promo) {
            const display = document.getElementById('promo-display');
            display.style.display = 'block';
            display.innerText = `Promo-kod: ${user.promo.code} (${user.promo.value} chegirma)`;
            if(user.promo.value.includes('%')) {
                const disc = parseInt(user.promo.value);
                finalPrice = finalPrice - (finalPrice * disc / 100);
            }
        }

        document.getElementById('m-price').innerText = finalPrice.toLocaleString() + " so'm";
        document.getElementById('p-size').innerHTML = "<option>Standart</option><option>M</option><option>L</option>";
        document.getElementById('order-modal').style.display = 'flex';
        selectedOrder = {name, price: finalPrice};
    }

    function sendOrder() {
        // Buyurtma berganda imkoniyat qo'shish
        user.chances += 1;
        user.promo = null; // Ishlatilgan promo o'chadi
        localStorage.setItem('ruslan_v2', JSON.stringify(user));
        
        const text = `🛒 BUYURTMA\nMahsulot: ${selectedOrder.name}\nNarx: ${selectedOrder.price}\nHudud: ${user.region}\nFoydalanuvchi: ${user.name}`;
        window.location.href = `https://t.me/Ruslanbek20119?text=${encodeURIComponent(text)}`;
    }

    function renderProducts(list) {
        document.getElementById('product-list').innerHTML = list.map(p => `
            <div class="card" onclick="openOrder('${p.name}', ${p.price})">
                <img src="${p.img}"><div class="p-info"><div class="title">${p.name}</div><div class="price">${(Math.round(p.price * 1.25)).toLocaleString()} so'm</div></div>
            </div>`).join('');
    }

    function openPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(id).classList.add('active-page');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    function closeModal() { document.getElementById('order-modal').style.display='none'; }
</script>
</body>
</html>
