<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruslan Market | Premium 100</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main: #7f46f0; --orange: #ff9800; --green: #28a745; --blue: #007bff; --red: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
        #auth-page { position: fixed; inset: 0; background: #fff; z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 320px; text-align: center; }
        .inp { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; outline: none; }
        .btn-reg { width: 100%; padding: 15px; background: var(--main); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        header { background: #fff; padding: 15px; text-align: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; }
        .container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; }
        .card img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
        .p-info { padding: 10px; }
        .price { color: #000; font-weight: bold; font-size: 15px; }
        .title { font-size: 13px; color: #444; height: 35px; overflow: hidden; margin-bottom: 5px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { border: none; background: none; font-size: 11px; color: #666; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .active { color: var(--main); font-weight: bold; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: #fff; width: 100%; max-width: 800px; border-radius: 20px; overflow: hidden; display: flex; flex-direction: row; max-height: 90vh; }
        .m-left { flex: 1.2; background: #fff; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .m-left img { width: 100%; max-height: 400px; object-fit: contain; }
        .m-right { flex: 1; padding: 20px; display: flex; flex-direction: column; border-left: 1px solid #eee; overflow-y: auto; }
        @media (max-width: 600px) { .modal-content { flex-direction: column; } .m-left { flex: none; height: 250px; } .m-right { border-left: none; border-top: 1px solid #eee; padding: 15px; } .container { grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; } }
        .uzum-price-box { background: #f8f8f8; padding: 12px; border-radius: 12px; margin: 10px 0; }
        .card-box { background: #f3f0ff; border: 1px dashed var(--main); padding: 10px; border-radius: 12px; margin-bottom: 10px; font-size: 13px; }
        .status-box { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--orange); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="auth-page" style="display: none;">
    <div class="auth-card">
        <h2 style="color: var(--main);">Xush kelibsiz!</h2>
        <input type="text" id="reg-name" class="inp" placeholder="Ismingiz">
        <input type="tel" id="reg-phone" class="inp" placeholder="Telefon raqamingiz">
        <button class="btn-reg" onclick="saveUser()">Kirish</button>
    </div>
</div>

<header><b>RUSLAN MARKET 🇨🇳 IMPORT</b></header>

<div id="shop-page"><div class="container" id="product-list"></div></div>
<div id="orders-page" style="display:none; padding: 20px;">
    <h3>📦 Buyurtmalarim</h3>
    <div id="order-status-list"></div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="showPage('shop', this)"><span>🛍</span>Do'kon</button>
    <button class="nav-item" onclick="showPage('orders', this)"><span>📦</span>Buyurtmalar</button>
</div>

<div id="order-modal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <div class="m-left"><img id="m-img" src=""></div>
        <div class="m-right">
            <h2 id="m-title" style="margin:0; font-size: 18px;"></h2>
            <div class="uzum-price-box">
                <div id="m-price" style="font-size: 22px; font-weight: bold;"></div>
                <small style="color: var(--green);">Tezkor yetkazib berish ✅</small>
            </div>
            <div class="card-box">
                <small>Karta (Humo):</small><br>
                <b id="card-num">4073420067355457</b>
                <button onclick="copyCard()" style="border:none; background:none; color:var(--main); cursor:pointer; font-weight:bold;">[Nusxa]</button>
            </div>
            <label style="font-size:11px; color:#666;">O'lchamni tanlang:</label>
            <select id="p-size" class="inp"></select>
            <input type="text" id="promo-code" class="inp" placeholder="Promokod">
            <button id="pay-btn" onclick="sendOrder()" class="btn-reg" style="margin-top:10px;">Payme orqali to'lash</button>
            <button onclick="closeModal()" style="background:none; border:none; color:#999; margin-top:10px; font-size:12px; cursor:pointer;">Yopish</button>
        </div>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    const BACKEND_URL = "https://bozorcha1.onrender.com";

    // 60% ustama hisoblash funksiyasi
    function calc60(p) { return Math.round(p * 1.6).toLocaleString(); }

    // Mahsulotlar bazasi
    const baseItems = [
        {name: "Nike Dunk Low Retro", price: 320000, type: "shoes", img: "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=500"},
        {name: "Oversize Hudi NYC", price: 140000, type: "clothing", img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=500"},
        {name: "Air Jordan 1 Low", price: 380000, type: "shoes", img: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=500"},
        {name: "Xiaomi Watch S2", price: 450000, type: "other", img: "https://images.unsplash.com/photo-1544117519-31a4b719223d?q=80&w=500"},
        {name: "Cargo Pants Black", price: 125000, type: "clothing", img: "https://images.unsplash.com/photo-1624372333454-359f97bf738e?q=80&w=500"},
        {name: "Tech Backpack", price: 95000, type: "other", img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?q=80&w=500"},
        {name: "Adidas Forum Low", price: 310000, type: "shoes", img: "https://images.unsplash.com/photo-1605348532760-6753d2c43329?q=80&w=500"},
        {name: "Puffer Jacket 2024", price: 480000, type: "clothing", img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=500"},
        {name: "Vintage T-Shirt", price: 65000, type: "clothing", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=500"},
        {name: "Wireless Buds Pro", price: 110000, type: "other", img: "https://images.unsplash.com/photo-1588423770119-945501899735?q=80&w=500"}
    ];

    // 100 ta mahsulotni generatsiya qilish
    const products = [];
    for(let i=0; i<100; i++) {
        let item = baseItems[i % baseItems.length];
        products.push({
            name: `${item.name} #${i+1}`,
            price: item.price + (i * 500), 
            type: item.type,
            img: item.img
        });
    }

    window.onload = () => { 
        if (!localStorage.getItem('ruslan_user')) document.getElementById('auth-page').style.display = 'flex'; 
        renderProducts(); 
    }
    
    function saveUser() {
        const n = document.getElementById('reg-name').value, p = document.getElementById('reg-phone').value;
        if (n.length > 2 && p.length > 6) { 
            localStorage.setItem('ruslan_user', JSON.stringify({name:n, phone:p})); 
            document.getElementById('auth-page').style.display = 'none'; 
        }
    }

    function renderProducts() { 
        document.getElementById('product-list').innerHTML = products.map(p => `
            <div class="card" onclick="openOrder('${p.name}', '${calc60(p.price)}', '${p.type}', '${p.img}')">
                <img src="${p.img}">
                <div class="p-info">
                    <div class="title">${p.name}</div>
                    <div class="price">${calc60(p.price)} so'm</div>
                </div>
            </div>`).join(''); 
    }

    let selectedP = {};
    function openOrder(name, price, type, img) {
        selectedP = {name, price, rawPrice: price, img};
        document.getElementById('m-title').innerText = name;
        document.getElementById('m-price').innerText = price + " so'm";
        document.getElementById('m-img').src = img;
        const s = document.getElementById('p-size');
        if(type==="clothing") s.innerHTML = ["S","M","L","XL","XXL"].map(x=>`<option>${x}</option>`).join('');
        else if(type==="shoes") s.innerHTML = ["38","39","40","41","42","43","44"].map(x=>`<option>${x}</option>`).join('');
        else s.innerHTML = "<option>Standart</option>";
        document.getElementById('order-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('order-modal').style.display='none'; }
    function copyCard() { navigator.clipboard.writeText("4073420067355457"); tg.showAlert("Nusxalandi!"); }

    async function sendOrder() {
        const user = JSON.parse(localStorage.getItem('ruslan_user'));
        const btn = document.getElementById('pay-btn'); 
        btn.innerText = "Kuting..."; btn.disabled = true;
        try {
            const res = await fetch(`${BACKEND_URL}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_name: user.name, phone: user.phone, 
                    product: selectedP.name, price: selectedP.price, 
                    size: document.getElementById('p-size').value
                })
            });
            const result = await res.json();
            if (result.pay_url) {
                localStorage.setItem('my_order', JSON.stringify({name: selectedP.name, date: Date.now(), status: "waiting"}));
                window.location.href = result.pay_url;
            } else { tg.showAlert("Xatolik!"); }
        } catch (e) { tg.showAlert("Server xatosi!"); }
        finally { btn.innerText = "Payme orqali to'lash"; btn.disabled = false; }
    }

    function showPage(p, b) {
        document.getElementById('shop-page').style.display = p === 'shop' ? 'block' : 'none';
        document.getElementById('orders-page').style.display = p === 'orders' ? 'block' : 'none';
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        if(b) b.classList.add('active'); 
        if(p === 'orders') updateStatus();
    }

    function updateStatus() {
        const order = JSON.parse(localStorage.getItem('my_order')), container = document.getElementById('order-status-list');
        if(!order) { container.innerHTML = "<p style='text-align:center;'>Buyurtmalar yo'q</p>"; return; }
        let st = "To'lov kutilmoqda...", rang = "var(--orange)";
        if(order.status === "confirmed") { st = "Yo'lga chiqdi 🚀"; rang = "var(--green)"; }
        if(order.status === "rejected") { st = "Rad etildi ❌"; rang = "var(--red)"; }
        container.innerHTML = `
            <div class="status-box" style="border-left:5px solid ${rang}">
                <b>${order.name}</b><br>
                <span style="color:${rang}">${st}</span><br>
                <input type="text" id="admin-code-input" placeholder="Kod" style="margin-top:8px; padding:5px; width:80px;">
                <button onclick="checkAdminCode()" style="margin-left:5px;">OK</button>
            </div>`;
    }

    function checkAdminCode() {
        const code = document.getElementById('admin-code-input').value.toUpperCase();
        let order = JSON.parse(localStorage.getItem('my_order'));
        if(code === "OK777") order.status = "confirmed";
        else if(code === "XATO777") order.status = "rejected";
        else if(code === "DELETE777") { localStorage.removeItem('my_order'); showPage('shop'); return; }
        else { tg.showAlert("Kod xato!"); return; }
        localStorage.setItem('my_order', JSON.stringify(order)); updateStatus();
    }
</script>
</body>
</html>
