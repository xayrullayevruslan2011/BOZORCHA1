<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topdimku Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding-bottom: 70px; }
        .header { background: #fff; padding: 15px; text-align: center; font-weight: bold; color: #7f46f0; font-size: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-info { padding: 10px; }
        .price { font-weight: bold; color: #333; margin: 5px 0; }
        .old-price { font-size: 12px; color: #999; text-decoration: line-through; }
        .btn-buy { background: #7f46f0; color: #fff; border: none; width: 100%; padding: 8px; border-radius: 8px; cursor: pointer; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; }
        .nav-item { font-size: 12px; color: #666; text-align: center; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">YOQIMLI XARIDLAR!</div>
    
    <div class="grid">
        <div class="card">
            <img src="https://images.uzum.uz/cl9v3mfn7rtg6qu9p3og/original.jpg" alt="Product">
            <div class="card-info">
                <div class="old-price">500,000 UZS</div>
                <div class="price">400,000 UZS</div>
                <div style="font-size: 13px; margin-bottom: 8px;">Kompressor Hoco</div>
                <button class="btn-buy" onclick="addToCart('Kompressor')">Sotib olish</button>
            </div>
        </div>
        <div class="card">
            <img src="https://images.uzum.uz/cl6sc096sfhsc0um2mfg/original.jpg" alt="Product">
            <div class="card-info">
                <div class="old-price">200,000 UZS</div>
                <div class="price">190,000 UZS</div>
                <div style="font-size: 13px; margin-bottom: 8px;">Tungi chiroq</div>
                <button class="btn-buy" onclick="addToCart('Chiroq')">Sotib olish</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item">🏠<br>Bosh sahifa</div>
        <div class="nav-item">🗂<br>Katalog</div>
        <div class="nav-item">🛒<br>Savat</div>
        <div class="nav-item">👤<br>Profil</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Appni to'liq ekranda ochish

        function addToCart(name) {
            tg.sendData("Savatga qo'shildi: " + name);
            tg.close();
        }
    </script>
</body>
</html>
